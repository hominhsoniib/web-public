server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Ảnh & font: cache dài hạn (1 năm, immutable).
    # LƯU Ý: tên file ảnh trong dự án này KHÔNG có content-hash (chỉ có hậu tố
    # kích thước như -480w/-768w, xem src/lib/imageManifest.ts). Nếu thay nội
    # dung ảnh mà giữ nguyên tên file, client sẽ tiếp tục hiển thị bản cache cũ
    # tới 1 năm — phải đổi tên file (hoặc thêm query string cache-busting) khi
    # cập nhật ảnh.
    location ~* \.(png|jpe?g|webp|avif|gif|svg|ico|woff2?|ttf|otf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # JS/CSS build ra từ Vite có content-hash trong tên file (VD index-B2fiTCp1.js)
    # -> đổi nội dung là đổi tên file, nên cache dài hạn immutable an toàn.
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # HTML: không cache (hoặc cache rất ngắn) để tránh phục vụ bản cũ sau khi deploy,
    # vì index.html là entry point tham chiếu tới các asset đã hash ở trên.
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Hỗ trợ React Router (Client-side routing) — fallback về index.html, cũng no-cache.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Bỏ qua logs cho favicon và robots.txt
    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }
}
